name: MCP Evidence Gate
description: Experimental downstream verifier and CI policy gate for evidence-scoped MCP security receipts.
author: yandexuanxuan

inputs:
  receipt:
    description: Path to the receipt JSON file.
    required: true
  artifact:
    description: Path to the exact artifact bytes covered by the receipt.
    required: true
  policy:
    description: Project-defined policy name, such as permissive or strict-release-example.
    required: true
  evidence:
    description: Path to an optional local evidence report matching receipt.evidence_digest.
    required: false

outputs:
  decision:
    description: "Derived policy decision: pass, warn, inconclusive, or fail."
  receipt-verdict:
    description: Original scanner verdict from the receipt.
  profile:
    description: Pinned compatibility profile identifier.

runs:
  using: node24
  main: dist/action/index.cjs

branding:
  icon: shield
  color: blue
