name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test profile drift classifier
        run: pnpm test:profile-drift

      - name: Build package
        run: pnpm build

      - name: Verify generated Action bundle is committed
        run: git diff --exit-code

      - name: CLI smoke test
        run: >-
          node dist/cli.js verify
          --receipt fixtures/valid/complete-clean.json
          --artifact fixtures/artifacts/current-artifact.bin
          --policy permissive
          --now 2026-08-25T00:00:00Z

      - name: Check live upstream profile drift
        id: profile_drift
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/profile-drift-sentinel.mjs --output profile-drift-report.json

      - name: Upload profile drift evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: profile-drift-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: profile-drift-report.json

      - name: Enforce profile drift result
        if: always()
        env:
          DRIFT_OUTCOME: ${{ steps.profile_drift.outcome }}
        run: test "$DRIFT_OUTCOME" = success
